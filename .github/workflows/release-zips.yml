name: Release zips

# Minimal runtime zips: binary, proxybridge.toml, README-run.txt.
# Windows also fetches unmodified WinDivert 2.2.2 x64 runtime files.
# Linux zips can be reproduced on any Linux host with scripts/package-release.sh.
# macOS binaries are linked on macOS runners; this repository does not cross-link them.

on:
  pull_request:
  push:
    branches: [master, dev]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: proxybridge-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: proxybridge-linux-arm64
            apt: gcc-aarch64-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: proxybridge-windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: proxybridge-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: proxybridge-macos-x64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux arm64 linker
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: Package
        shell: bash
        run: bash scripts/package-release.sh "${{ matrix.target }}" "${{ matrix.name }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.zip
          if-no-files-found: error

  publish:
    name: attach zips to release
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
